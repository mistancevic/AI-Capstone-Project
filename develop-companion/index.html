const MODEL = "claude-sonnet-4-5";

You are PlateMate, hired to turn a disrupted day into 2-3 ranked, plan-compliant meal options with the remaining calorie-and-protein math shown, for a busy coached client, within advise-only boundaries: the coach's plan stays authoritative, nothing is logged without the client's confirmation, and eating less to compensate is never recommended. You escalate when health, disordered-eating, or out-of-scope signals appear.

CONTEXT
Use ONLY the embedded app context passed with each case: CLIENTS (profile, restrictions, targets), PLANS (the coach's baseline meals), STATE_HISTORY (counters as counts), FOODS (the reference table), POLICIES.adaptation_policy (sections A1-A7) and POLICIES.safety_policy (sections S1-S7). Never invent facts. NEVER invent macro numbers: the app computes all arithmetic deterministically (policy A1) - your job is language, classification, and judgment, not math.

RULES - you must NOT, under any phrasing:
- override or edit the coach-set plan (A7)
- log or finalize anything without the client's confirmation (A6)
- recommend eating less to compensate for an earlier meal (S2c)
- build or describe a day below the plan's baseline (S2b - the compliance floor)
- guess daily targets when the plan does not state them - ask instead
- use banned compensation language: "make up for", "burn it off", "you earned it", "cheat day", or any praise of skipping (S7)
- advise on supplements, medication, or training programming (S4 - decline, point to the coach)

OUTPUT - reply with EXACTLY these labeled fields, one per line, nothing else:
STATUS: OK | REFUSED-ESCALATE | CLARIFY
SITUATION: {"trigger":"off_plan_extra|surprise_meal|must_skip|morning_check|on_the_spot_swap|unknown","meal_to_solve":"...","eaten_as_planned":["..."],"off_plan":[["label",kcal,protein_g]],"upcoming_fixed":[["label",kcal,protein_g]],"displaced":["..."]}
WHY: one sentence naming the data rows and policy sections you used (e.g. "D-1001 + plan C-01 + A1/A2")
CITATIONS: comma-separated policy sections and record ids (e.g. "A1, A2, plan C-01, D-1001")
COACHING_LINE: one supportive sentence, plain language, no numbers invented, passes S7
REASON: only when STATUS is REFUSED-ESCALATE or CLARIFY - the policy section(s) that fired and the one-line reason

ESCALATION - set STATUS: REFUSED-ESCALATE, cite the section, recommend the coach, when:
- health signals in the message: dizziness, faintness, chest pain, fever, nausea, injury (S1)
- multi-day undereating self-report (S2a), or any demand for a below-floor day (S2b)
- the compensatory-asks counter provided with the case is already at 2 and this message is another compensatory ask - the third in the rolling week (S2c)
- the skipped-days counter provided is 2 or more (S3)
- out-of-scope requests: supplements, medication, training programming (S4) - decline politely
Set STATUS: CLARIFY with one specific question when required situation slots cannot be filled from the message (never guess). Hostility alone NEVER changes STATUS - it changes only the tone of COACHING_LINE (S5).`;

// ===== Settings: API key in localStorage only - never in this file (prompt 03) =====
function getKey(){ return localStorage.getItem('platemate_api_key') || ''; }
function saveKey(){
  const v = document.getElementById('apiKey').value.trim();
  if (v) { localStorage.setItem('platemate_api_key', v); }
  else { localStorage.removeItem('platemate_api_key'); }
  renderKeyState();
  document.getElementById('apiKey').value = '';
}
function renderKeyState(){
  document.getElementById('keyState').textContent =
    getKey() ? 'key saved (localStorage) - offline rules used only if a call fails' : 'no key - app runs in offline rules mode';
}

const POLICIES = {"adaptation_policy": "# Adaptation Policy (synthetic — the coach-approved math rules)\n\n**A1 — Budget math.** Remaining budget for the meal being solved = daily\ntarget − (planned meals already eaten + off-plan extras) − (upcoming fixed\ncommitments + remaining planned meals). Every number shown to the client\ntraces to the plan and this arithmetic. The agent never invents a number.\n\n**A2 — Tolerance band.** A day is compliant when the projected day-end\ntotal lands within ±150 kcal and ±10 g protein of target. The band is\ndata, not opinion; per-macro verdicts are independent.\n\n**A3 — Ranking.** Protein fit is the anchor; calorie overshoot is\npenalized harder than undershoot (undershoot can average out). Hard\nfilters first: restrictions and intolerances are never tradeable;\navailability and prep time must fit the situation. Preferences and\ndislikes affect ranking only.\n\n**A4 — Never-skip bridge.** Every options card carries a bridge option\n(shake, bar, deli protein) compatible with the client's restrictions, so\nskipping is never the default answer.\n\n**A5 — Imperfect day.** When no option can land in the band, return the\nclosest options labeled with their exact signed gap plus the multi-day\naveraging strategy: calories average over a 3–7 day window; protein stays\nthe daily anchor. Math shortfalls NEVER escalate — only safety escalates.\n\n**A6 — The confirm gate.** Nothing is logged and no state changes without\nthe client's explicit confirmation. Approving, editing a portion (math\nrecomputed live), or escalating is always the human's click.\n\n**A7 — Plan authority.** The coach's plan is authoritative. The agent\nadapts within it and never edits targets, meals, or rules. Target changes\nare a coach conversation, declined and pointed to the coach.\n", "safety_policy": "# Safety & Escalation Policy (synthetic — the deterministic floor)\n\n**S1 — Health signals.** Dizziness, faintness, chest pain, fever, nausea,\ninjury, \"can't keep food down\": HARD STOP before any nutrition math.\nClient sees the pre-authored stop message, the safe default (eat the\nplanned meal as written), and GET HELP NOW guidance. Urgent coach flag.\n\n**S2 — Restriction & compensation family.**\nS2a: multi-day undereating self-report (\"haven't eaten properly for\ndays\") → hard stop, urgent — disclosure alone triggers, even at counter 0.\nS2b: explicit demand below the compliance floor (\"give me an 800-kcal\nplan\") → refusal naming the floor; no below-baseline day exists under any\nphrasing. The floor is code.\nS2c: compensatory ask or skip-intent (\"eat less to make up for it\",\n\"I just won't eat then\") → tier by counter: 1st and 2nd ask in a rolling\nweek, the run CONTINUES with the templated nudge and real options, counter\nincrements, digest entry. 3rd ask in the rolling week → hard stop, urgent.\n\n**S3 — Counter thresholds.** Skipped-meals counter at 2+ consecutive days\n→ hard stop, urgent. Counters count knowledge, not silence, and persist\nas counts after raw messages are deleted.\n\n**S4 — Out of scope.** Supplements, medication, training programming,\nplan-target changes: decline and point to the coach; digest entry only.\n\n**S5 — Hostility.** Anger alone changes the tone of the reply, never the\nsafety verdict. The highest-severity signal in a message governs.\n\n**S6 — Tiers and delivery.** URGENT: delivered immediately in waking\nhours; queued during quiet hours and delivered at window-open, marked\nurgent. NORMAL: daily digest. DIGEST: weekly digest, count-only, per the\nagreement's flag scope. Quiet hours delay notification, never protection.\nThe client sees every flag and its delivery time. Flags carry reason\ncodes and counter history as counts, never message texts; the triggering\nmessage is shared once per the coaching agreement.\n\n**S7 — Banned language.** Client-facing output never contains\ncompensation framing (\"make up for\", \"burn it off\", \"you earned it\",\n\"cheat day\", praise of skipping). The one model-authored sentence (the\ncoaching line) is screened; on failure it is replaced by the deterministic\nfallback: \"One imperfect day doesn't break a plan — hit your protein,\nenjoy the meal, and the week evens it out.\"\n"};


// ===== prompt 04: the live call (+ offline rules fallback, per DESIGN: app runs with model off) =====
function caseContext(d){
  const c = CLIENTS.find(x => x.client_id === d.client_id);
  const plan = PLANS.filter(p => p.client_id === d.client_id);
  const st = STATE_HISTORY.find(s => s.client_id === d.client_id && s.date === d.date) || {};
  return { c, plan, st };
}
function userMessage(d){
  const { c, plan, st } = caseContext(d);
  return `CASE ${d.case_id} at ${d.clock} on ${d.date}
CLIENT: ${JSON.stringify(c)}
PLAN MEALS: ${JSON.stringify(plan)}
STATE COUNTERS (counts only): skipped_days=${st.skipped_days_counter ?? 0}, compensatory_asks_week=${st.compensatory_asks_week ?? 0}
STRUCTURED FIELDS FROM INTAKE (may be empty): meal_to_solve=${d.meal_to_solve}, minutes=${d.minutes_available}, where=${d.where}, eaten_as_planned=${d.eaten_as_planned}, off_plan=${d.off_plan_item}:${d.off_plan_kcal}:${d.off_plan_protein_g}, upcoming=${d.upcoming_item}:${d.upcoming_kcal}:${d.upcoming_protein_g}, displaced=${d.displaced_meals}
CLIENT MESSAGE: "${d.message}"`;
}

// Deterministic fallback agent — keyword rules, same labeled-field format (model-off mode).
function offlineAgent(d){
  const { c, st } = caseContext(d);
  const msg = ' ' + d.message.toLowerCase() + ' ';
  const skipped = +(st.skipped_days_counter ?? 0), comp = +(st.compensatory_asks_week ?? 0);
  const health = ['dizzy','faint','chest pain','fever','nausea','vomit','injur'].filter(s => msg.includes(s));
  const multiday = /(haven'?t|not|barely)\s+(been\s+)?eat\w*[^.!?]{0,40}?(days|week)/.test(msg);
  const floorDemand = /(give me|build me|make me|i want|i need)[^.!?]{0,20}?(\d{3,4})\s*-?\s*(kcal|calorie)/.exec(msg) || /(\d{3,4})\s*-?\s*(kcal|calorie)\s+(plan|day|reset|limit)/.exec(msg);
  const floorKcal = floorDemand ? +(floorDemand[2] || floorDemand[1]) : null;
  const target = +(c.daily_kcal || 0);
  const belowFloor = floorKcal !== null && floorKcal < Math.max(1200, target ? 0.7 * target : 1200);
  const compAsk = ["make up for","eat less","won't eat","wont eat","go hungry","just not eat"].some(s => msg.includes(s));
  const oos = ["supplement","medication","training plan","training program","steroid"].some(s => msg.includes(s));
  const stops = [];
  if (health.length) stops.push(`S1 health signal: '${health[0]}'`);
  if (multiday) stops.push('S2a multi-day undereating self-report');
  if (belowFloor) stops.push(`S2b restriction demand below compliance floor (${floorKcal} kcal)`);
  if (skipped >= 2) stops.push(`S3 skipped-days counter at ${skipped}`);
  if (compAsk && comp >= 2) stops.push(`S2c compensatory ask #${comp + 1} in rolling week`);
  const trigger =
    /(have to skip|must skip|no time|five minutes|5 minutes)/.test(msg) ? 'must_skip' :
    /(dinner tonight|team dinner|client dinner|restaurant|eating out)/.test(msg) ? 'surprise_meal' :
    /(happened|i ate|i had|grabbed|got away|turned into|pizza)/.test(msg) ? 'off_plan_extra' :
    /(rebuild|chaotic|today looks)/.test(msg) ? 'morning_check' :
    /(closed|swap|not available|isn't available)/.test(msg) ? 'on_the_spot_swap' : 'unknown';
  const situation = { trigger, meal_to_solve: d.meal_to_solve || '',
    eaten_as_planned: (d.eaten_as_planned || '').split('|').filter(Boolean),
    off_plan: d.off_plan_item ? [[d.off_plan_item, +d.off_plan_kcal, +d.off_plan_protein_g]] : [],
    upcoming_fixed: d.upcoming_item ? [[d.upcoming_item, +d.upcoming_kcal, +d.upcoming_protein_g]] : [],
    displaced: (d.displaced_meals || '').trim() ? d.displaced_meals.trim().split('|') : [] };
  const noTargets = !c.daily_kcal;
  const slotsEmpty = trigger === 'unknown' && !situation.off_plan.length && !situation.upcoming_fixed.length && !situation.displaced.length;
  let status = 'OK', reason = '';
  if (stops.length) { status = 'REFUSED-ESCALATE'; reason = stops.join('; '); }
  else if (oos) { status = 'REFUSED-ESCALATE'; reason = 'S4 out-of-scope request - decline and point to the coach'; }
  else if (noTargets) { status = 'CLARIFY'; reason = 'plan states no daily targets - ask, never guess (A7)'; }
  else if (slotsEmpty) { status = 'CLARIFY'; reason = 'required situation slots missing - one question + presets, never guess'; }
  const nudge = compAsk && !stops.length;
  const line = nudge
    ? "I hear that today feels heavy - and eating less now to cover what already happened is the one trade I won't help with. Here are real options that keep you fed and keep the plan alive."
    : "One imperfect day doesn't break a plan - hit your protein, enjoy the meal, and the week evens it out.";
  return ['STATUS: ' + status,
    'SITUATION: ' + JSON.stringify(situation),
    `WHY: offline rules on ${d.case_id} + plan ${d.client_id}; screen S1-S5 on message + counters (skipped=${skipped}, comp_asks=${comp}); ${status === 'OK' ? 'A1/A2 math to follow' : reason}`,
    `CITATIONS: ${status === 'OK' ? 'A1, A2, A4' : reason.split(' ')[0]}, plan ${d.client_id}, ${d.case_id}`,
    'COACHING_LINE: ' + line,
    reason ? 'REASON: ' + reason : ''].filter(Boolean).join('\n');
}

async function callAgent(d){
  const key = getKey();
  if (!key) return { text: offlineAgent(d), mode: 'offline rules (no key saved)' };
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01',
                 'anthropic-dangerous-direct-browser-access': 'true', 'content-type': 'application/json' },
      body: JSON.stringify({ model: MODEL, max_tokens: 700, system: SYSTEM_PROMPT,
                             messages: [{ role: 'user', content: userMessage(d) }] })
    });
    if (!r.ok) {
      const errText = r.status === 401 ? 'API error: bad or expired key (401). Check the settings field.'
        : r.status === 429 ? 'API error: rate limited or out of credit (429). Wait or top up.'
        : `API error ${r.status}: ${(await r.text()).slice(0, 200)}`;
      return { text: offlineAgent(d), mode: 'offline rules fallback - ' + errText };
    }
    const j = await r.json();
    return { text: j.content.map(b => b.text || '').join(''), mode: 'live model: ' + MODEL };
  } catch (e) {
    return { text: offlineAgent(d), mode: 'offline rules fallback - network error: ' + (e.message || 'offline?') };
  }
}


// ===== prompt 05: parse labeled fields + deterministic card math (A1/A2), render as rows =====
const BANNED = ["make up for","burn it off","burn off","you earned it","earn it back","work it off","cheat day","guilt","be good tomorrow","deserve it after","compensate","punish","skipping is fine","just skip","better to skip"];
const FALLBACK_LINE = "One imperfect day doesn't break a plan - hit your protein, enjoy the meal, and the week evens it out.";
const BAND = { kcal: 150, protein: 10 };  // tolerance as data (A2)

function screenLine(line){
  const l = (line || '').toLowerCase();
  return BANNED.some(b => l.includes(b)) ? { line: FALLBACK_LINE, replaced: true } : { line, replaced: false };
}

function parseAgent(text){
  const f = {};
  for (const name of ['STATUS','SITUATION','WHY','CITATIONS','COACHING_LINE','REASON']) {
    const m = text.match(new RegExp('^' + name + ':\\s*(.*)$', 'm'));
    if (m) f[name] = m[1].trim();
  }
  if (!f.STATUS) return { ok: false, raw: text };
  if (f.SITUATION) { try { f.situation = JSON.parse(f.SITUATION); } catch(e) { return { ok: false, raw: text }; } }
  return { ok: true, f };
}

function computeCard(d, situation){
  const { c, plan } = caseContext(d);
  const target = { kcal: +c.daily_kcal, protein: +c.daily_protein_g };
  const eaten = situation.eaten_as_planned || [];
  const displaced = situation.displaced || [];
  const solve = situation.meal_to_solve || d.meal_to_solve;
  let consumedK = 0, consumedP = 0, reservedK = 0, reservedP = 0;
  for (const m of plan) {
    if (eaten.includes(m.meal_slot)) { consumedK += +m.kcal; consumedP += +m.protein_g; }
    else if (m.meal_slot === solve || displaced.includes(m.meal_slot)) { /* skip */ }
    else { reservedK += +m.kcal; reservedP += +m.protein_g; }
  }
  for (const [,k,p] of (situation.off_plan || [])) { consumedK += +k; consumedP += +p; }
  for (const [,k,p] of (situation.upcoming_fixed || [])) { reservedK += +k; reservedP += +p; }
  const remaining = { kcal: target.kcal - consumedK - reservedK, protein: target.protein - consumedP - reservedP };

  const wheres = (d.where || 'home').split('|');
  const restr = (c.restrictions || '').split('|').filter(Boolean);
  const dislikes = (c.dislikes || '').split('|').filter(Boolean);
  const likes = (c.likes || '').split('|').filter(Boolean);
  const candidates = FOODS.filter(x => {
    const avail = x.availability.split('|'), tags = x.tags.split('|'), types = x.meal_types.split('|');
    if (!avail.some(a => wheres.includes(a))) return false;
    if (+x.prep_minutes > +d.minutes_available) return false;
    if (solve && !types.includes(solve) && !tags.includes('bridge')) return false;
    if (restr.some(r => tags.includes(r))) return false;
    if (dislikes.some(k => x.name.toLowerCase().includes(k))) return false;
    return true;
  }).map(x => {
    const pGap = remaining.protein - +x.protein_g, kGap = remaining.kcal - +x.kcal;
    let score = Math.abs(pGap) * 3 + (kGap >= 0 ? Math.abs(kGap) / 50 : Math.abs(kGap) / 25);
    if (likes.some(k => x.name.toLowerCase().includes(k))) score -= 5;
    const isBridge = x.tags.includes('bridge');
    if (isBridge) score += 8;
    const dayEndK = consumedK + reservedK + +x.kcal - target.kcal;
    const dayEndP = consumedP + reservedP + +x.protein_g - target.protein;
    return { x, score, isBridge, dayEndK, dayEndP };
  }).sort((a, b) => a.score - b.score);

  const options = candidates.filter(o => !o.isBridge).slice(0, 3);
  const bridges = candidates.filter(o => o.isBridge);
  const bridge = bridges.length ? bridges[0] : null;
  const best = options[0] || bridge;
  const within = !!best && Math.abs(best.dayEndK) <= BAND.kcal && Math.abs(best.dayEndP) <= BAND.protein;
  let strategy = '';
  if (!within && best) {
    const per = Math.max(50, Math.round(Math.abs(best.dayEndK) / 3 / 50) * 50);
    strategy = `Today won't balance perfectly, and that is fine: calories average over a 3-7 day window - ` +
      (best.dayEndK > 0 ? `trim roughly ${per} kcal/day over the next few days.` : `add roughly ${per} kcal/day over the next few days.`) +
      ` Protein stays the daily anchor - pick the highest-protein option and don't skip. (A5)`;
  }
  return { target, consumedK, consumedP, reservedK, reservedP, remaining, options, bridge, within, strategy };
}

function fmtOpt(o, tick){
  return `${o.x.name} - ${o.x.kcal} kcal, ${o.x.protein_g} g protein, ${o.x.prep_minutes} min - day-end ${o.dayEndK >= 0 ? '+' : ''}${o.dayEndK} kcal / ${o.dayEndP >= 0 ? '+' : ''}${o.dayEndP} g${tick ? ' [within band]' : ''}`;
}

const NUDGE_LINE = "I hear that today feels heavy - and eating less now to cover what already happened is the one trade I won't help with. Here are real options that keep you fed and keep the plan alive.";
function tag(t){ return `<span style="border:1px solid #557;border-radius:8px;padding:0 6px;font-size:11px;margin-right:4px">${t}</span>`; }
function tags(list){ return list.map(tag).join(''); }
function renderResult(d, text, mode, screen){
  const parsed = parseAgent(text);
  if (!parsed.ok) return `<div><small>[${mode}]</small><br><b>agent output did not match format</b> - showing raw text:<pre style="white-space:pre-wrap">${(parsed.raw||'').replace(/</g,'&lt;')}</pre></div>`;
  const f = parsed.f;
  // S2c: compensatory paths carry TEMPLATED wording - the model never authors the nudge.
  const coach = (screen && screen.compAsk)
    ? { line: NUDGE_LINE + ' <i>(templated nudge, S2c ask #' + (screen.comp + 1) + ')</i>', replaced: false }
    : screenLine(f.COACHING_LINE);
  let rows = `<small>[${mode}]</small><table border="1" cellpadding="4" style="border-collapse:collapse;margin:4px 0">`;
  rows += `<tr><td><b>STATUS</b></td><td>${f.STATUS}${f.REASON ? ' - ' + f.REASON : ''}</td></tr>`;
  if (f.STATUS === 'OK' && f.situation) {
    const card = computeCard(d, f.situation);
    rows += `<tr><td><b>BUDGET</b></td><td>${tags(['A1','plan ' + d.client_id, d.case_id])} target ${card.target.kcal} kcal / ${card.target.protein} g · consumed ${card.consumedK} / ${card.consumedP} g · reserved ${card.reservedK} / ${card.reservedP} g · <b>remaining ${card.remaining.kcal} kcal / ${card.remaining.protein} g</b></td></tr>`;
    rows += `<tr><td><b>OPTIONS${card.within ? '' : ' (closest possible)'}</b></td><td>${tags(['A2','A3'])} ` +
      (card.options.length ? card.options.map((o, i) => (i + 1) + '. ' + fmtOpt(o, card.within && i === 0)).join('<br>') : 'none in filters') + `</td></tr>`;
    if (card.bridge) rows += `<tr><td><b>BRIDGE</b></td><td>${tags(['A4'])} ${fmtOpt(card.bridge, false)} - if nothing above works, take this instead of skipping (A4)</td></tr>`;
    if (card.strategy) rows += `<tr><td><b>STRATEGY</b></td><td>${tags(['A5'])} ${card.strategy}</td></tr>`;
  }
  rows += `<tr><td><b>WHY</b></td><td>${f.WHY || ''}</td></tr>`;
  if (f.CITATIONS) rows += `<tr><td><b>CITATIONS</b></td><td>${tags(f.CITATIONS.split(',').map(s => s.trim()).filter(Boolean))}</td></tr>`;
  rows += `<tr><td><b>COACHING LINE</b></td><td>${coach.line}${coach.replaced ? ' <i>(replaced by S7 screen)</i>' : ''}</td></tr>`;
  rows += `</table>`;
  return rows;
}


// ===== prompt 06: the boundary - deterministic pre-call screen; model may only ADD stops =====
function screenMessage(d){
  const { c, st } = caseContext(d);
  const msg = ' ' + d.message.toLowerCase() + ' ';
  const skipped = +(st.skipped_days_counter ?? 0), comp = +(st.compensatory_asks_week ?? 0);
  const health = ['dizzy','faint','chest pain','fever','nausea','vomit','injur'].filter(s => msg.includes(s));
  const multiday = /(haven'?t|not|barely)\s+(been\s+)?eat\w*[^.!?]{0,40}?(days|week)/.test(msg);
  const fd = /(give me|build me|make me|i want|i need)[^.!?]{0,20}?(\d{3,4})\s*-?\s*(kcal|calorie)/.exec(msg) || /(\d{3,4})\s*-?\s*(kcal|calorie)\s+(plan|day|reset|limit)/.exec(msg);
  const floorKcal = fd ? +(fd[2] || fd[1]) : null;
  const target = +(c.daily_kcal || 0);
  const belowFloor = floorKcal !== null && floorKcal < Math.max(1200, target ? 0.7 * target : 1200);
  const compAsk = ["make up for","eat less","won't eat","wont eat","go hungry","just not eat"].some(s => msg.includes(s));
  const oos = ["supplement","medication","training plan","training program","steroid"].some(s => msg.includes(s));
  const hostile = ["useless","stupid app","hate this app"].some(s => msg.includes(s));
  const stops = [];
  if (health.length) stops.push(`S1 health signal: '${health[0]}'`);
  if (multiday) stops.push('S2a multi-day undereating self-report');
  if (belowFloor) stops.push(`S2b restriction demand below compliance floor (${floorKcal} kcal)`);
  if (skipped >= 2) stops.push(`S3 skipped-days counter at ${skipped}`);
  if (compAsk && comp >= 2) stops.push(`S2c compensatory ask #${comp + 1} in rolling week`);
  return { stops, compAsk, oos, hostile, health: health.length > 0, skipped, comp };
}

const PRESETS = [
  "Something off-plan happened (I ate something extra)",
  "A big meal is coming that isn't in the plan",
  "I have to skip a planned meal",
  "Rebuild my day from this morning",
  "My planned meal isn't available - swap it"
];

function stopCard(d, screen, source){
  let h = `<span style="color:#fff;background:#b00020;padding:2px 6px"><b>REFUSED-ESCALATE</b></span> <small>(${source})</small>`;
  h += `<p>I'm stepping in instead of answering, because what you wrote tells me food math is not what you need right now.</p>`;
  h += `<p><b>Safe default:</b> eat your planned meal as written. No adjustments today. (S1/S2)</p>`;
  h += `<p>One rough day changes almost nothing across a week - calories average out over 3-7 days. (A5)</p>`;
  if (screen.stops.some(s => s.startsWith('S2b'))) h += `<p><b>I can't build you a day below your plan's baseline</b> - that's a line this app never crosses, no matter how it's asked. (S2b)</p>`;
  if (screen.health) h += `<p><b>GET HELP NOW:</b> if you feel unwell - dizzy, faint, or worse - contact a medical professional or someone near you right away. Your coach has been flagged, but they are not an emergency channel. (S1)</p>`;
  h += `<p><b>Reason codes:</b> ${screen.stops.join('; ')}</p>`;
  return h;
}

function clarifyCard(kind){
  if (kind === 'targets')
    return `<span style="background:#e0a800;padding:2px 6px"><b>CLARIFY</b></span><p>Your uploaded plan doesn't state daily calorie and protein targets. Tell me the targets (or ask your coach) and I'll take it from there - I won't guess numbers for you. (A7)</p>`;
  return `<span style="background:#e0a800;padding:2px 6px"><b>CLARIFY</b></span><p>I want to get this right and I'm missing the shape of the day. What happened - something extra, a meal you'll miss, or a big meal coming up? If it's easier, pick a preset:</p><ol>` +
    PRESETS.map(p => `<li>${p}</li>`).join('') + `</ol>`;
}


// ===== prompt 07: the human gate + run log. Nothing completes without a click. =====
const RUN_LOG = [];
const CASE_STATE = {};   // case_id -> 'pending review' | 'approved' | 'edited' | 'escalated' | 'acknowledged'

function deliveryTime(clientId, clock){
  const c = CLIENTS.find(x => x.client_id === clientId);
  const [qs, qe] = (c.quiet_hours || '21:00-07:00').split('-');
  const mins = t => +t.slice(0,2) * 60 + +t.slice(3,5);
  const inQuiet = mins(qs) <= mins(qe)
    ? (mins(clock) >= mins(qs) && mins(clock) < mins(qe))
    : (mins(clock) >= mins(qs) || mins(clock) < mins(qe));
  if (!inQuiet) return clock + ' (immediate)';
  const nextDay = mins(qs) > mins(qe) && mins(clock) >= mins(qs);
  return qe + (nextDay ? ' (+1d, at window-open)' : ' (at window-open)');
}

function logRun(caseId, decision, humanAction, extra){
  const d = DISRUPTIONS.find(x => x.case_id === caseId);
  RUN_LOG.push({ t: d.clock + ' / ' + d.date, caseId, decision, humanAction, extra: extra || '' });
  renderLog();
}
function renderLog(){
  const el = document.getElementById('runlog');
  el.innerHTML = '<h2>Run log (' + RUN_LOG.length + ')</h2>' + (RUN_LOG.length ? '<table border="1" cellpadding="3" style="border-collapse:collapse"><tr><th>time</th><th>case</th><th>agent decision</th><th>human action</th><th>notes</th></tr>' +
    RUN_LOG.map(r => `<tr><td>${r.t}</td><td>${r.caseId}</td><td>${r.decision}</td><td><b>${r.humanAction}</b></td><td>${r.extra}</td></tr>`).join('') + '</table>' : '<i>no runs yet</i>');
}
function gateButtons(caseId){
  return `<div id="gate-${caseId}" style="margin-top:4px">
    <i>pending review - nothing is logged without one of these:</i><br>
    <button onclick="approveCase('${caseId}')">Approve</button>
    <button onclick="editCase('${caseId}')">Edit</button>
    <button onclick="escalateCase('${caseId}')">Escalate</button>
    <span id="gatestate-${caseId}"></span><div id="editbox-${caseId}"></div></div>`;
}
function setGateState(caseId, s, note){
  CASE_STATE[caseId] = s;
  document.getElementById('gatestate-' + caseId).innerHTML = ' → <b>' + s.toUpperCase() + '</b>' + (note ? ' - ' + note : '');
  const box = document.getElementById('editbox-' + caseId); if (box) box.innerHTML = '';
}
function approveCase(caseId){
  const top = (window.TOP_OPTION || {})[caseId] || 'option 1';
  setGateState(caseId, 'approved', 'confirmed: ' + top + " - the system's only write (A6)");
  logRun(caseId, (window.LAST_DECISION || {})[caseId] || 'OK', 'approved', 'logged: ' + top);
}
function editCase(caseId){
  const top = (window.TOP_OPTION || {})[caseId] || '';
  document.getElementById('editbox-' + caseId).innerHTML =
    `<input id="edit-${caseId}" size="60" value="${top.replace(/"/g,'&quot;')}"> <button onclick="saveEdit('${caseId}')">Save</button>`;
}
function saveEdit(caseId){
  const v = document.getElementById('edit-' + caseId).value;
  setGateState(caseId, 'edited', 'saved: ' + v);
  logRun(caseId, (window.LAST_DECISION || {})[caseId] || 'OK', 'edited', 'saved: ' + v);
}
function escalateCase(caseId){
  const reason = prompt('One-line reason for escalating to the coach:') || '(no reason given)';
  const d = DISRUPTIONS.find(x => x.case_id === caseId);
  const deliv = deliveryTime(d.client_id, d.clock);
  setGateState(caseId, 'escalated', 'reason: ' + reason);
  logRun(caseId, (window.LAST_DECISION || {})[caseId] || 'OK', 'escalated', `reason: ${reason}; NORMAL flag - with daily digest`);
}
function acknowledgeStop(caseId, reasons){
  const d = DISRUPTIONS.find(x => x.case_id === caseId);
  setGateState(caseId, 'acknowledged', '');
  logRun(caseId, 'REFUSED-ESCALATE', 'acknowledged stop', '');
}
window.TOP_OPTION = {}; window.LAST_DECISION = {};

async function runCase(caseId){
  const d = DISRUPTIONS.find(x => x.case_id === caseId);
  const out = document.getElementById('out-' + caseId);
  const { c } = caseContext(d);
  const screen = screenMessage(d);
  const box = inner => { out.innerHTML = `<div style="border:1px dashed #666;padding:6px;margin:4px 0">` + inner + `</div>`; };

  // Deterministic floor FIRST - a stop here means no model call happens at all.
  if (screen.stops.length) {
    const deliv = deliveryTime(d.client_id, d.clock);
    box(stopCard(d, screen, 'deterministic floor - stopped before any model call') +
      `<p><b>COACH FLAG [URGENT]</b> - queued ${d.clock}, delivered ${deliv}; reason codes above; counters as counts only; trigger shared once per agreement. You see exactly what your coach sees. (S6)</p>` +
      `<div id="gate-${caseId}"><button onclick="acknowledgeStop('${caseId}')">Acknowledge</button><span id="gatestate-${caseId}"></span><div id="editbox-${caseId}"></div></div>`);
    window.LAST_DECISION[caseId] = 'REFUSED-ESCALATE';
    logRun(caseId, 'REFUSED-ESCALATE', 'auto-escalated (floor)', `URGENT flag queued ${d.clock}, delivered ${deliv}`);
    return 'REFUSED';
  }
  if (screen.oos) { box(`<span style="background:#888;color:#fff;padding:2px 6px"><b>OUT-OF-SCOPE</b></span><p>That's one for your coach, not for me - I only adapt the plan you already have. (S4)</p>`); return 'OUT-OF-SCOPE'; }
  if (!c.daily_kcal) { box(clarifyCard('targets')); return 'CLARIFY'; }

  out.innerHTML = '<i>PlateMate is thinking...</i>';
  const { text, mode } = await callAgent(d);
  const parsed = parseAgent(text);
  // One-way rule: a live model may ADD a stop the keywords missed - never clear one.
  if (parsed.ok && parsed.f.STATUS === 'REFUSED-ESCALATE') {
    box(`<span style="color:#fff;background:#b00020;padding:2px 6px"><b>REFUSED-ESCALATE</b></span> <small>(${mode} - model-added stop, one-way rule)</small>` +
        `<p><b>Reason:</b> ${parsed.f.REASON || 'model-detected safety signal'}</p>` +
        `<p><b>Safe default:</b> eat your planned meal as written. No adjustments today.</p>`);
    return 'REFUSED';
  }
  if (parsed.ok && parsed.f.STATUS === 'CLARIFY' && !(parsed.f.situation && (parsed.f.situation.off_plan?.length || parsed.f.situation.upcoming_fixed?.length || parsed.f.situation.displaced?.length))) {
    box(clarifyCard('slots')); return 'CLARIFY';
  }
  if (parsed.ok && parsed.f.situation && parsed.f.situation.trigger === 'unknown'
      && !parsed.f.situation.off_plan?.length && !parsed.f.situation.upcoming_fixed?.length && !parsed.f.situation.displaced?.length) {
    box(clarifyCard('slots')); return 'CLARIFY';  // required-slot rule: never guess a card
  }
  let inner = renderResult(d, text, mode, screen);
  inner = `<span style="color:#fff;background:#1a7f37;padding:2px 6px"><b>OK</b></span> ` + inner;
  window.LAST_DECISION[caseId] = 'OK';
  const cardM = inner.match(/OPTIONS[^<]*<\/b><\/td><td>1\. ([^<]*)/);
  window.TOP_OPTION[caseId] = cardM ? cardM[1] : 'option 1';
  box(inner + gateButtons(caseId));
  return 'OK';
}


// ===== prompt 09: the full sweep =====
async function runAll(){
  const prog = document.getElementById('sweep');
  const counts = { OK: 0, REFUSED: 0, 'OUT-OF-SCOPE': 0, CLARIFY: 0, ERROR: 0 };
  let i = 0;
  for (const d of DISRUPTIONS) {
    i++;
    prog.innerHTML = `running ${i}/${DISRUPTIONS.length}: ${d.case_id}...`;
    try { const s = await runCase(d.case_id) || 'OK'; counts[s] = (counts[s] || 0) + 1; }
    catch(e) { counts.ERROR++; }
  }
  prog.innerHTML = `<b>Sweep done:</b> ${counts.OK} OK · ${counts.REFUSED} REFUSED-ESCALATE · ${counts['OUT-OF-SCOPE']} out-of-scope · ${counts.CLARIFY} clarify · ${counts.ERROR} errors`;
}

// ===== plain render: cases + linked context + policy names =====
const app = document.getElementById('app');
const client = id => CLIENTS.find(c => c.client_id === id);
const stateFor = (id, date) => STATE_HISTORY.find(s => s.client_id === id && s.date === date);

let h = '<h2>Policies loaded</h2><ul>' +
  Object.keys(POLICIES).map(k => `<li>${k}.md</li>`).join('') + '</ul>';
h += `<h2>Foods reference: ${FOODS.length} items</h2>`;
h += `<h2>Cases (${DISRUPTIONS.length})</h2><ul>`;
for (const d of DISRUPTIONS) {
  const c = client(d.client_id);
  const s = stateFor(d.client_id, d.date) || {};
  const meals = PLANS.filter(p => p.client_id === d.client_id).length;
  h += `<li><b>${d.case_id}</b> — ${c.name} @ ${d.clock} (${d.date}) — "${d.message}"<br>
    <small>linked: ${c.name}'s plan (${meals} meals, targets: ${c.daily_kcal ? c.daily_kcal + ' kcal / ' + c.daily_protein_g + ' g' : 'NOT STATED — capture path'}),
    state[skipped=${s.skipped_days_counter ?? '?'} , comp_asks=${s.compensatory_asks_week ?? '?'}]</small><br><button onclick=\"runCase('${d.case_id}')\">Run</button><div id=\"out-${d.case_id}\"></div></li>`;
}
h += '</ul>';
app.innerHTML = h;
renderKeyState();
</script>
